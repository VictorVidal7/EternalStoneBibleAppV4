name: CI

on:
  # Run on every pushed branch, not just main/develop — otherwise a feature
  # branch only gets its first CI run when it lands on main, which is how two
  # red pushes (a flaky test surfacing only under the CI job's slower
  # `--maxWorkers=2 --coverage` config) went unnoticed in Sept 2026.
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

# One in-flight run per ref — a new push to a branch cancels its previous
# still-running CI so iterating on a branch doesn't stack full 3-job runs.
# `main` is excluded from cancellation so a merge is always fully validated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Node 24, not 20: `scripts/build-web-packs.js` requires `node:sqlite`, which
# is unusable before Node 22.13 (it exists from 22.5 but throws
# without --experimental-sqlite until then) — and `__tests__/buildWebPacks.test.js` plus
# `__tests__/redLetterPackParity.test.ts` both load that script. On Node 20 the
# two suites fail to LOAD, so the gate guarding the only thing in this repo that
# produces published data reports nothing at all while the rest of the run looks
# fine. That is exactly what happened for four consecutive pushes to `main` in
# Sept 2026. `__tests__/ciNodeVersion.test.ts` is the detector; keep the two in
# step (it also pins `engines` in package.json to the same floor).

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Check formatting
        run: npm run format:check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # `npm audit` reads the lockfile, so it needs no node_modules and this
      # job deliberately skips installing for it. Verified equivalent across
      # the Node 20 -> 24 move: same 14 advisories, same moderate/high split,
      # same exit code.
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      # R9-94: `npm outdated` is NOT like `npm audit` — its whole output is the
      # version each package is INSTALLED at, and this job never installed. So
      # all 57 direct dependencies came back `MISSING`, the step exited 1 on
      # THAT rather than on anything about versions, and `continue-on-error`
      # swallowed it. It had run that way in every green run since the job was
      # written. (`--package-lock-only` does NOT substitute: measured on a bare
      # package.json + lockfile, it still prints `MISSING` for all 57.)
      #
      # So install first. The npm cache above makes it cheap, and the step now
      # reports what it always claimed to.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline

      - name: Check for outdated packages
        run: npm outdated
        continue-on-error: true
